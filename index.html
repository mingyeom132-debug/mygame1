<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>서울 성벽 디펜스</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #12121a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  header { width: 100%; max-width: 450px; padding: 10px 12px; background: #1e1e2e; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3a3a52; font-size: 13px; font-weight: bold; }
  .hp { color: #ff5555; } .gold { color: #f1fa8c; } .wave { color: #8be9fd; }
  #speed-btn { background: #44475a; color: #fff; border: 1px solid #6272a4; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: bold; }
  #speed-btn.active { background: #ffb86c; color: #12121a; }
  #game-box { position: relative; width: 100%; max-width: 450px; flex: 1; display: flex; justify-content: center; align-items: center; background: #181824; }
  canvas { background: #1b1c26; touch-action: manipulation; }
  #controls { width: 100%; max-width: 450px; background: #1e1e2e; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #3a3a52; }
  .row { display: flex; gap: 6px; }
  .btn { flex: 1; background: #282a36; border: 2px solid #6272a4; border-radius: 8px; padding: 6px 2px; color: #fff; text-align: center; }
  .btn.selected { border-color: #50fa7b; background: #343746; }
  .btn.sell.selected { border-color: #ff5555; background: #3b2328; }
  .name { font-size: 11px; font-weight: bold; }
  .cost { font-size: 11px; color: #f1fa8c; margin: 2px 0; }
  .desc { font-size: 9px; color: #bd93f9; }
  #wave-btn { width: 100%; padding: 11px; background: #ff5555; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; }
  #wave-btn:disabled { background: #44475a; color: #888; }
  #msg { position: absolute; top: 12px; background: rgba(0,0,0,0.85); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #50fa7b; pointer-events: none; opacity: 0; transition: 0.3s; }
</style>
</head>
<body>

<header>
  <span class="wave">🌀 W.<b id="w-txt">1</b></span>
  <span class="gold">💎 <b id="g-txt">150</b></span>
  <span class="hp">🏰 성벽 <b id="h-txt">100</b></span>
  <button id="speed-btn" onclick="toggleSpeed()">⏩ 1배속</button>
</header>

<div id="game-box">
  <div id="msg">하단 성벽 칸을 터치해 배치!</div>
  <canvas id="cv"></canvas>
</div>

<div id="controls">
  <div class="row">
    <div class="btn selected" onclick="pick('rifle', 50, this)">
      <div class="name">🔫 기동대</div><div class="cost">💎 50</div><div class="desc">빠른 연사</div>
    </div>
    <div class="btn" onclick="pick('sniper', 100, this)">
      <div class="name">🎯 저격수</div><div class="cost">💎 100</div><div class="desc">관통 강타</div>
    </div>
    <div class="btn" onclick="pick('mage', 120, this)">
      <div class="name">🔮 결계사</div><div class="cost">💎 120</div><div class="desc">3열 슬로우</div>
    </div>
    <div class="btn sell" onclick="pick('sell', 0, this)">
      <div class="name">♻️ 철거</div><div class="cost">50% 환급</div><div class="desc">유닛 회수</div>
    </div>
  </div>
  <button id="wave-btn" onclick="startWave()">⚔️ 웨이브 시작</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LANES = 5;
cv.width = Math.min(window.innerWidth, 450);
cv.height = window.innerHeight - 180;
const LW = cv.width / LANES;
const WY = cv.height - LW * 1.15;

let gold = 150, hp = 100, wave = 1, active = false, over = false, spd = 1;
let sel = { type: 'rifle', cost: 50 };
let slots = [null, null, null, null, null];
let enemies = [], bullets = [], texts = [];
let toSpawn = 0, spawnT = 0;

function toast(t, c = '#50fa7b') {
  const m = document.getElementById('msg');
  m.innerText = t; m.style.color = c; m.style.opacity = 1;
  setTimeout(() => m.style.opacity = 0, 1400);
}

function toggleSpeed() {
  spd = spd === 1 ? 2 : 1;
  const b = document.getElementById('speed-btn');
  b.innerText = spd === 1 ? '⏩ 1배속' : '🔥 2배속';
  b.classList.toggle('active', spd === 2);
}

function pick(type, cost, el) {
  sel = { type, cost };
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

cv.addEventListener('pointerdown', e => {
  if (over) return;
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (y < WY - 15) return toast("아래쪽 성벽 칸을 터치하세요!", "#ffb86c");
  const lane = Math.floor(x / LW);
  if (lane < 0 || lane >= LANES) return;
  const cur = slots[lane];

  if (sel.type === 'sell') {
    if (!cur) return toast("철거할 유닛이 없습니다.", "#ff5555");
    const ref = Math.floor(cur.spent * 0.5);
    gold += ref; slots[lane] = null;
    toast(`철거 완료 (+💎${ref})`, "#8be9fd");
    return syncUI();
  }

  if (cur) {
    const upg = cur.lv * 60;
    if (gold < upg) return toast(`강화 비용 부족 (💎${upg})`, "#ff5555");
    gold -= upg; cur.spent += upg; cur.lv++;
    cur.dmg = Math.floor(cur.dmg * 1.45);
    toast(`Lv.${cur.lv} 강화 완료!`);
    return syncUI();
  }

  if (gold < sel.cost) return toast("마정석이 부족합니다!", "#ff5555");
  gold -= sel.cost;
  const cfg = {
    rifle:  { dmg: 14, cd: 28, c: '#8be9fd', ic: '🔫', v: 12 },
    sniper: { dmg: 60, cd: 75, c: '#ff79c6', ic: '🎯', v: 20 },
    mage:   { dmg: 12, cd: 50, c: '#bd93f9', ic: '🔮', v: 9 }
  }[sel.type];
  slots[lane] = { lane, type: sel.type, lv: 1, spent: sel.cost, t: 0, ...cfg };
  syncUI();
});

function startWave() {
  if (active || over) return;
  active = true;
  toSpawn = 6 + wave * 3;
  spawnT = 0;
  const b = document.getElementById('wave-btn');
  b.disabled = true;
  b.innerText = `⚔️ WAVE ${wave} 방어 중...`;
}

function syncUI() {
  document.getElementById('w-txt').innerText = wave;
  document.getElementById('g-txt').innerText = gold;
  document.getElementById('h-txt').innerText = hp;
}

function step() {
  if (over) return;
  if (active && toSpawn > 0 && --spawnT <= 0) {
    const lane = Math.floor(Math.random() * LANES);
    const boss = (toSpawn === 1 && wave % 3 === 0);
    const fast = (!boss && wave >= 2 && Math.random() < 0.25);
    const base = 45 + wave * 28;
    const mhp = boss ? base * 4 : (fast ? base * 0.65 : base);
    enemies.push({
      lane, x: lane * LW + LW / 2, y: 35, hp: mhp, max: mhp,
      v: boss ? 0.45 : (fast ? 1.35 : 0.75 + Math.min(wave * 0.03, 0.6)),
      slow: 0, atk: 0, rew: boss ? 60 : 12 + wave * 2, boss, fast
    });
    toSpawn--;
    spawnT = Math.max(25, 65 - wave * 2);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    let v = e.v;
    if (e.slow > 0) { v *= 0.5; e.slow--; }
    if (e.y < WY - 18) e.y += v;
    else if (++e.atk >= 50) {
      e.atk = 0;
      const d = e.boss ? 15 : 5;
      hp = Math.max(0, hp - d);
      texts.push({ x: e.x, y: WY, t: `-${d}`, c: '#ff5555', l: 25 });
      syncUI();
      if (hp <= 0) {
        over = true;
        alert(`성벽이 무너졌습니다! 최종 기록: WAVE ${wave}`);
        return location.reload();
      }
    }
  }

  slots.forEach(s => {
    if (!s) return;
    if (s.t > 0) s.t--;
    if (s.t <= 0) {
      const hit = enemies.some(e => s.type === 'mage' ? Math.abs(e.lane - s.lane) <= 1 : e.lane === s.lane);
      if (hit) {
        bullets.push({ lane: s.lane, x: s.lane * LW + LW / 2, y: WY + LW * 0.4, dmg: s.dmg, v: s.v, c: s.c, type: s.type, seen: [] });
        s.t = s.cd;
      }
    }
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.v;
    if (b.y < 20) { bullets.splice(i, 1); continue; }
    for (const e of enemies) {
      if (b.seen.includes(e)) continue;
      const ok = b.type === 'mage' ? Math.abs(e.lane - b.lane) <= 1 : e.lane === b.lane;
      if (ok && Math.abs(b.y - e.y) < 18) {
        e.hp -= b.dmg;
        b.seen.push(e);
        if (b.type === 'mage') e.slow = 70;
        if (b.type !== 'sniper') { bullets.splice(i, 1); break; }
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].hp <= 0) {
      gold += enemies[i].rew;
      texts.push({ x: enemies[i].x, y: enemies[i].y, t: `+💎${enemies[i].rew}`, c: '#f1fa8c', l: 25 });
      enemies.splice(i, 1);
      syncUI();
    }
  }

  for (let i = texts.length - 1; i >= 0; i--) {
    texts[i].y -= 0.6;
    if (--texts[i].l <= 0) texts.splice(i, 1);
  }

  if (active && toSpawn === 0 && enemies.length === 0) {
    active = false; wave++;
    gold += 35 + wave * 5;
    hp = Math.min(100, hp + 10);
    syncUI();
    const b = document.getElementById('wave-btn');
    b.disabled = false;
    b.innerText = `⚔️ WAVE ${wave} 시작`;
    toast(`WAVE 클리어! 성벽 수리(+10) & 보너스!`);
  }
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  for (let i = 0; i < LANES; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#1e202c' : '#232533';
    ctx.fillRect(i * LW, 0, LW, WY);
    ctx.font = `${LW * 0.45}px sans-serif`;
    ctx.fillText('🌀', i * LW + LW / 2, 22);
  }

  ctx.fillStyle = '#383a59';
  ctx.fillRect(0, WY, cv.width, cv.height - WY);
  ctx.fillStyle = '#6272a4';
  ctx.fillRect(0, WY - 6, cv.width, 6);

  for (let i = 0; i < LANES; i++) {
    const x = i * LW;
    ctx.strokeStyle = '#50537a'; ctx.lineWidth = 2;
    ctx.strokeRect(x + 4, WY + 4, LW - 8, LW - 8);
    const s = slots[i];
    if (s) {
      ctx.font = `${LW * 0.5}px sans-serif`;
      ctx.fillText(s.ic, x + LW / 2, WY + LW * 0.45);
      ctx.fillStyle = '#50fa7b'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText(`Lv.${s.lv}`, x + LW / 2, WY + LW * 0.85);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '12px sans-serif';
      ctx.fillText('배치', x + LW / 2, WY + LW * 0.5);
    }
  }

  bullets.forEach(b => {
    ctx.fillStyle = b.c;
    if (b.type === 'mage') {
      ctx.globalAlpha = 0.45;
      ctx.fillRect((b.lane - 1) * LW + 5, b.y - 6, LW * 3 - 10, 12);
      ctx.globalAlpha = 1;
    } else if (b.type === 'sniper') {
      ctx.fillRect(b.x - 3, b.y - 12, 6, 24);
    } else {
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
    }
  });

  enemies.forEach(e => {
    ctx.font = `${LW * (e.boss ? 0.65 : 0.45)}px sans-serif`;
    ctx.fillText(e.boss ? '👹' : (e.fast ? '🐺' : '👾'), e.x, e.y);
    if (e.slow > 0) {
      ctx.fillStyle = 'rgba(189,147,249,0.4)';
      ctx.beginPath(); ctx.arc(e.x, e.y, LW * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    const bw = LW * 0.65;
    ctx.fillStyle = '#ff5555'; ctx.fillRect(e.x - bw / 2, e.y - LW * 0.35, bw, 5);
    ctx.fillStyle = '#50fa7b'; ctx.fillRect(e.x - bw / 2, e.y - LW * 0.35, bw * Math.max(0, e.hp / e.max), 5);
  });

  texts.forEach(t => {
    ctx.fillStyle = t.c; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(t.t, t.x, t.y);
  });
}

function loop() {
  for (let i = 0; i < spd; i++) step();
  draw();
  requestAnimationFrame(loop);
}

syncUI();
loop();
</script>
</body>
</html>
