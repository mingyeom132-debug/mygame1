<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SEOUL WALL: GOLDEN DEFENSE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e18;color:#f7e9cc;font-family:system-ui,sans-serif;touch-action:manipulation}body{max-width:560px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);border-inline:1px solid #29364b}
header{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:9px 10px;background:linear-gradient(110deg,#26364d,#111a2a);border-bottom:2px solid #bd9148}.logo{font-weight:1000;font-size:13px;letter-spacing:1px;color:#ffdc91}.stats{display:flex;gap:4px}.stat{font-size:11px;padding:5px 6px;border:1px solid #53627b;background:#0c1422;border-radius:7px;white-space:nowrap}.gold{color:#ffd15b}.wallhp{color:#ff9292}.wave{color:#b7d4ff}
#msg{min-height:30px;padding:7px 8px;text-align:center;background:#101a2a;color:#c3d0e0;font-size:11px;border-bottom:1px solid #35445c}
#arena{flex:1;min-height:0;padding:5px;background:radial-gradient(ellipse at center,#26354a,#101827);display:flex;justify-content:center}canvas{height:100%;width:100%;max-width:500px;display:block;border:2px solid #5c6572;border-radius:8px;image-rendering:pixelated;touch-action:manipulation}
footer{padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#101725;border-top:2px solid #59677d;display:flex;flex-direction:column;gap:7px}
#roster{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.unit{padding:7px 2px;border-radius:8px;background:#1b293c;color:#f5e8d0;border:1px solid #53647e;min-width:0}.unit.sel{border:2px solid #ffd15b;background:#34435b}.unit b{display:block;font-size:11px}.unit small{display:block;color:#b7c6d9;font-size:9px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:0;border-radius:8px;padding:11px 4px;font-weight:900;font-size:12px}.upgrade{background:linear-gradient(#edc45d,#a96e29);color:#281a08}.start{background:linear-gradient(#c64e50,#772d3c);color:#fff}.action:disabled{opacity:.45;filter:grayscale(1)}#hint{text-align:center;color:#8192aa;font-size:9px}
</style>
</head>
<body>
<header><div class="logo">SEOUL WALL<br><span style="font-size:9px;color:#b8c9dd">GOLDEN DEFENSE</span></div><div class="stats"><span class="stat wave">WAVE <b id="wave">1</b></span><span class="stat gold">◆ <b id="gold">60</b></span><span class="stat wallhp">성벽 <b id="wall">100</b>%</span></div></header>
<div id="msg">대원을 선택하고 성벽 앞 배치 슬롯을 눌러 배치하세요.</div>
<div id="arena"><canvas id="game"></canvas></div>
<footer><div id="roster">
<button class="unit sel" data-kind="guard"><b>수호자</b><small>배치 ◆ 20</small></button>
<button class="unit" data-kind="archer"><b>명사수</b><small>배치 ◆ 25</small></button>
<button class="unit" data-kind="mage"><b>비전술사</b><small>배치 ◆ 30</small></button>
</div><div class="actions"><button id="upgrade" class="action upgrade">◆  강화하기</button><button id="start" class="action start">웨이브 시작</button></div><div id="hint">배치된 대원을 터치해 선택 · 금괴로 최대 3회 승급</div></footer>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=360,H=600,dpr=1,gold=60,wall=100,wave=1,started=false,ended=false,selectedKind='guard',selectedUnit=null,tick=0,spawnLeft=0,spawnClock=0;
const slots=[{x:.22,y:.76},{x:.5,y:.76},{x:.78,y:.76}];
const roster={
 guard:{cost:20,names:['성문 수호자','철벽 기사','왕실 방벽장','불굴의 성벽군주'],hp:170,damage:15,range:135,rate:48,color:'#e2b75c'},
 archer:{cost:25,names:['정찰 사수','황혼 명궁','천공의 추적자','백야의 신궁'],hp:95,damage:25,range:235,rate:58,color:'#67c6e8'},
 mage:{cost:30,names:['룬 견습생','청휘 마도사','별빛 현자','시공의 대현자'],hp:105,damage:19,range:185,rate:66,color:'#ba8cf4'}
};
let units=[],enemies=[],shots=[],sparks=[];
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=Math.max(240,r.width);H=Math.max(320,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);resize();
function say(s){$('msg').textContent=s}
function sync(){$('gold').textContent=gold;$('wall').textContent=Math.max(0,wall);$('wave').textContent=wave}
function stats(u){const d=roster[u.kind],lv=u.level;return{hp:d.hp*(1+(lv-1)*.48),damage:d.damage*(1+(lv-1)*.55),range:d.range+(lv-1)*12,rate:Math.max(22,d.rate-(lv-1)*5)}}
function choose(kind){selectedKind=kind;selectedUnit=null;document.querySelectorAll('.unit').forEach(b=>b.classList.toggle('sel',b.dataset.kind===kind));$('upgrade').textContent='◆ 강화하기';}
document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>choose(b.dataset.kind));
function posSlot(i){return{x:W*slots[i].x,y:H*slots[i].y}}
function pointer(e){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let nearest=null,dist=1e9;units.forEach(u=>{let d=Math.hypot(u.x-x,u.y-y);if(d<dist){dist=d;nearest=u}});if(nearest&&dist<Math.min(45,W*.12)){selectedUnit=nearest;selectedKind=nearest.kind;document.querySelectorAll('.unit').forEach(b=>b.classList.toggle('sel',b.dataset.kind===selectedKind));$('upgrade').textContent='◆ '+(nearest.level<4?[20,35,55][nearest.level-1]+' 금괴로 승급':'최고 단계');say(nearest.name+' 선택됨 · 승급 '+(nearest.level-1)+'/3');return}
 let best=-1;dist=1e9;slots.forEach((s,i)=>{const p=posSlot(i),d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best=i}});if(dist<Math.min(58,W*.16))place(best)}
canvas.addEventListener('pointerdown',pointer);
function place(i){if(units.some(u=>u.slot===i)){selectedUnit=units.find(u=>u.slot===i);say(selectedUnit.name+' 선택됨. 아래 강화 버튼으로 승급하세요.');$('upgrade').textContent='◆ 강화하기';return}const d=roster[selectedKind];if(gold<d.cost){say('금괴가 부족합니다. 적을 막아 금괴를 모으세요.');return}gold-=d.cost;const p=posSlot(i),u={kind:selectedKind,slot:i,x:p.x,y:p.y,level:1,hp:d.hp,cd:10,name:d.names[0]};units.push(u);selectedUnit=u;sync();say(d.names[0]+' 배치 완료!');$('upgrade').textContent='◆ 강화하기'}
$('upgrade').onclick=()=>{if(!selectedUnit||!units.includes(selectedUnit)){say('먼저 배치된 대원을 터치해 선택하세요.');return}const u=selectedUnit;if(u.level>=4){say('이미 최고 단계입니다.');return}const cost=[20,35,55][u.level-1];if(gold<cost){say('금괴가 부족합니다. 필요 금괴: '+cost);return}gold-=cost;const old=stats(u);u.level++;const d=stats(u);u.hp+=d.hp-old.hp;u.name=roster[u.kind].names[u.level-1];say('승급 완료! '+u.name+' · 능력 강화');$('upgrade').textContent='◆ '+(u.level<4?[20,35,55][u.level-1]+' 금괴로 승급':'최고 단계');sync()};
$('start').onclick=()=>{if(started||ended)return;started=true;spawnLeft=5+wave*2;spawnClock=20;$('start').disabled=true;$('start').textContent='전투 진행 중';say('웨이브 '+wave+' 시작! 성벽을 지켜라!')};
function spawn(){const lane=W*(.15+Math.random()*.7);const boss=wave%4===0&&spawnLeft===1;enemies.push({x:lane,y:-25,hp:(boss?170:48)+wave*12,max:(boss?170:48)+wave*12,speed:boss?0.42:0.62+Math.min(1,wave*.025),size:boss?30:21,boss,hit:0});spawnLeft--;spawnClock=Math.max(35,90-wave*3)}
function attack(){for(const u of units){const s=stats(u);if(u.cd>0){u.cd--;continue}let target=null,dist=s.range;for(const e of enemies){const d=Math.hypot(e.x-u.x,e.y-u.y);if(d<dist){dist=d;target=e}}if(target){target.hp-=s.damage;target.hit=5;shots.push({x:u.x,y:u.y-10,tx:target.x,ty:target.y,col:roster[u.kind].color,life:9});u.cd=s.rate}}}
function update(){if(ended)return;tick++;if(started){if(spawnLeft>0&&--spawnClock<=0)spawn();attack();for(const e of enemies){e.y+=e.speed;if(e.hit>0)e.hit--}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0){gold+=e.boss?18:5;sparks.push({x:e.x,y:e.y,t:18});enemies.splice(i,1)}else if(e.y>H*.88){wall-=e.boss?16:8;enemies.splice(i,1);say('적이 성벽에 도달했습니다! 방어선을 보강하세요.')}}if(wall<=0){wall=0;ended=true;started=false;$('start').textContent='방어 실패';say('성벽이 무너졌습니다. 새로고침해 다시 도전하세요.')}else if(spawnLeft===0&&enemies.length===0){started=false;wave++;gold+=15;$('start').disabled=false;$('start').textContent='다음 웨이브';say('방어 성공! 보너스 금괴 15개 획득. 다음 웨이브를 준비하세요.')}}sync()}

const pixelSprites={
 guard:[
 "......KKKK......",".....KGGGGK.....","....KGGGGGGK....","....KSSSSSSK....","...KSSSSSSSSK...","...KSSFFSSFFSK..","...KSfFSSSfFSK..","...KSSSSSSSSSK..","....KSSSSSSK....","..KKKAAAAAAKKK..",".KAAAHAAAAHAAAK.","KAAAHHAAAAHHAAAK","KAAASAAAAAASAAAK","KSSSSAAAAAASSSSK","..KSSSAAAAASSSK..","...KKK....KKK....","...KSS....SSK....","...KSS....SSK....","..KKKK....KKKK...","..KKKK....KKKK..."],
 archer:[
 "......KKKK......",".....KBBBBK.....","....KBBBBBBK....","....KSSSSSSK....","...KSSSSSSSSK...","...KSFFSSFFSK...","...KSfFSSSfFSK..","...KSSSSSSSSSK..","....KSSSSSSK....","...KKKAAAAKKK...","..KBBBHAAAHBBK..",".KBBBHAAAAHBBBK.","KBBBBSAAAAASBBBK","KSSSSSAAAAASSSSK","..KSSSAAAAASSSK..","...KKK....KKK....","...KBB....BBK....","...KBB....BBK....","..KKKK....KKKK...","..KKKK....KKKK..."],
 mage:[
 ".......KK.......","......KPPK......",".....KPPPPK.....","....KPPPPPPK....","...KSSSSSSSSK...","...KSFFSSFFSK...","...KSfFSSSfFSK..","...KSSSSSSSSSK..","....KSSSSSSK....","....KPPPPPPK....","...KPPPHPPPPK...","..KPPPHHPPPPPK..",".KPPPPSPPPPPPPK.","KSSSSSSSSSSSSSSK","..KSSSPPPPSSSK...","...KKK....KKK....","...KPP....PPK....","...KPP....PPK....","..KKKK....KKKK...","..KKKK....KKKK..."]
};
function drawPixelSprite(x,y,kind,level,scale=1){
 const rows=pixelSprites[kind], palettes={
 K:'#111827',S:kind==='guard'?'#4c5360':kind==='archer'?'#254d67':'#4d3478',
 A:kind==='guard'?'#b98238':kind==='archer'?'#397fa0':'#8054b5',
 H:kind==='guard'?'#f4d27c':kind==='archer'?'#8ce4f4':'#d6b2ff',
 B:'#327d9c',P:'#7650a7',G:'#e8b94f',F:'#b87555',f:'#f1c49a',E:'#fff1a6'
 };
 const p=level>=3?{...palettes,A:'#d6a94f',H:'#fff0a8'}:palettes;
 const px=2.15*scale,py=2.15*scale;
 ctx.save();ctx.translate(Math.round(x-rows[0].length*px/2),Math.round(y-rows.length*py/2));
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(3*px,rows.length*py-1,10*px,2*py);
 for(let ry=0;ry<rows.length;ry++)for(let rx=0;rx<rows[ry].length;rx++){
  const ch=rows[ry][rx];if(ch==='.')continue;
  let color=p[ch]||'#263247';
  if(ch==='A'&&level===4)color='#f5d77d';
  ctx.fillStyle=color;ctx.fillRect(rx*px,ry*py,px,py);
 }
 // distinct class equipment, facial pixels and promotion crest
 ctx.fillStyle='#111827';ctx.fillRect(7*px,6*py,px,py);ctx.fillRect(10*px,6*py,px,py);
 ctx.fillStyle='#f8e7c5';ctx.fillRect(8*px,8*py,2*px,py);
 if(kind==='guard'){ctx.fillStyle='#e8c46d';ctx.fillRect(1*px,11*py,2*px,5*py);ctx.fillRect(13*px,11*py,2*px,5*py)}
 if(kind==='archer'){ctx.fillStyle='#e7d6a8';ctx.fillRect(14*px,8*py,px,9*py);ctx.fillRect(13*px,8*py,3*px,px)}
 if(kind==='mage'){ctx.fillStyle='#ffe58d';ctx.fillRect(14*px,5*py,2*px,2*py);ctx.fillRect(15*px,3*py,px,2*py)}
 if(level>=2){ctx.fillStyle='#f7d979';ctx.fillRect(6*px,1*py,4*px,px)}
 if(level>=4){ctx.fillStyle='#fff0a8';ctx.fillRect(5*px,0,6*px,px);ctx.fillRect(7*px,-2*py,2*px,2*py)}
 ctx.restore();
}
function drawEnemy(e){
 const x=Math.round(e.x),y=Math.round(e.y),s=e.boss?2.1:1.55;
 const rows=e.boss?[
 "....KKKKKK....","...KRRRRRRK...","..KRRRRRRRRK..","..KSSRRRRSSK..",".KSSKRRRRKSSK.",".KSSKKRRKKSSK.","..KRRK..KRRK..","..KRRRRRRRRK..","...KRRRRRRK...","..KKKRRRRKKK..",".KSSKRRRRKSSK.","KSSSKRRRRKSSSK","KSSSKRRRRKSSSK",".KKK......KKK.","..KK......KK.."
 ]:[
 "....KKKK....","...KRRRRK...","..KRRRRRRK..","..KSSRRSSK..","..KRRRRRRK..","...KRRRRK...","..KKRRRRKK..",".KSSKRRKSSK.","KSSSKRRKSSSK.","..KK....KK..","..KK....KK.."
 ];
 ctx.save();ctx.translate(x-rows[0].length*s/2,y-rows.length*s/2);
 const pal={K:'#171b2a',R:e.boss?'#9b3e50':'#79505f',S:e.boss?'#e07876':'#b77a82'};
 for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=rows[j][i];if(c!=='.'){ctx.fillStyle=pal[c];ctx.fillRect(i*s,j*s,s,s)}}
 ctx.fillStyle='#ffe18a';ctx.fillRect(4*s,3*s,s,s);ctx.fillRect(7*s,3*s,s,s);
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1b2a43');sky.addColorStop(.65,'#35435a');sky.addColorStop(1,'#192435');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#d4c18d';for(let i=0;i<8;i++){const x=i*W/7;ctx.fillRect(x,H*.1,2,H*.56)}
ctx.fillStyle='#26364b';ctx.fillRect(0,H*.12,W,H*.06);for(let i=0;i<9;i++){ctx.fillStyle='#60718a';ctx.fillRect(i*W/8,H*.105,W/16,H*.09)}
ctx.fillStyle='#53647a';ctx.fillRect(0,H*.85,W,H*.15);ctx.fillStyle='#8795a8';ctx.fillRect(0,H*.85,W,5);for(let i=0;i<9;i++){ctx.fillStyle='#34465d';ctx.fillRect(i*W/8,H*.88,W/16,H*.12)}
ctx.fillStyle='#d6b66e';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('SEOUL LAST WALL',W/2,H*.945);
slots.forEach((s,i)=>{const p=posSlot(i),u=units.find(v=>v.slot===i);ctx.fillStyle=u?'rgba(238,197,102,.12)':'rgba(170,190,215,.12)';ctx.strokeStyle=u?'#e5bd68':'#91a5bf';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(p.x-28,p.y-27,56,54,8);ctx.fill();ctx.stroke();if(u){drawPixelSprite(p.x,p.y,u.kind,u.level,1.0);ctx.fillStyle='#fff';ctx.font='bold 9px system-ui';ctx.fillText(u.name,p.x,p.y+39);ctx.fillStyle='#111';ctx.fillRect(p.x-22,p.y+43,44,4);ctx.fillStyle='#68d69a';ctx.fillRect(p.x-22,p.y+43,44*Math.max(0,u.hp/stats(u).hp),4);if(selectedUnit===u){ctx.strokeStyle='#ffe18b';ctx.lineWidth=2;ctx.strokeRect(p.x-33,p.y-32,66,78)}}else{ctx.fillStyle='#b9c9dc';ctx.font='bold 10px system-ui';ctx.fillText('배치 '+(i+1),p.x,p.y+4)}})
for(const e of enemies){drawEnemy(e);ctx.fillStyle='#111';ctx.fillRect(e.x-e.size/2,e.y-e.size*.72,e.size,4);ctx.fillStyle='#f16e79';ctx.fillRect(e.x-e.size/2,e.y-e.size*.72,e.size*Math.max(0,e.hp/e.max),4)}
for(const p of shots){ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.tx,p.ty);ctx.stroke();p.life--}shots=shots.filter(p=>p.life>0);for(const s of sparks){ctx.fillStyle='#ffd76a';ctx.fillRect(s.x-3,s.y-3,6,6);s.t--}sparks=sparks.filter(s=>s.t>0);
if(!started&&!ended){ctx.fillStyle='rgba(4,9,17,.35)';ctx.fillRect(8,H*.28,W-16,35);ctx.fillStyle='#f8e4b4';ctx.font='bold 12px system-ui';ctx.fillText('대원을 배치하고 웨이브를 시작하세요',W/2,H*.28+22)}}
function loop(){update();draw();requestAnimationFrame(loop)}sync();loop();
</script>
</body>
</html>
